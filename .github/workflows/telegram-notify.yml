name: Telegram Push & Deployment Alert

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Send Telegram Push Alert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7630488220' }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          node -e "
          const https = require('https');
          const { execSync } = require('child_process');

          const token = (process.env.TELEGRAM_BOT_TOKEN || '').trim();
          const chatId = (process.env.TELEGRAM_CHAT_ID || '7630488220').trim();

          if (!token || !chatId) {
            console.log('Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID. Skipping Telegram alert.');
            process.exit(0);
          }

          const rawMsg = process.env.COMMIT_MSG || 'Update codebase';
          const author = process.env.COMMIT_AUTHOR || 'Developer';
          const fullHash = process.env.COMMIT_HASH || 'main';
          const shortHash = fullHash.substring(0, 7);

          let changedFiles = 'N/A';
          try {
            const diffOutput = execSync('git diff --name-only HEAD~1 HEAD', { encoding: 'utf8' }).trim();
            if (diffOutput) {
              const files = diffOutput.split('\n').filter(Boolean);
              const topFiles = files.slice(0, 8).map(f => '• ' + f);
              if (files.length > 8) {
                topFiles.push('... এবং আরও ' + (files.length - 8) + 'টি ফাইল');
              }
              changedFiles = topFiles.join('\n');
            }
          } catch (_) {
            changedFiles = '• Changes committed to main';
          }

          const bstTime = new Date().toLocaleString('en-GB', {
            timeZone: 'Asia/Dhaka',
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: true
          }) + ' (BST)';

          const text = '🚀 *BJS Academy নতুন গিট পুশ সম্পন্ন!*\\n\\n' +
            '📦 *কমিট আইডি:* \`' + shortHash + '\`\\n' +
            '👤 *কমিট করেছেন:* ' + author + '\\n' +
            '💬 *কমিট মেসেজ:*\\n' +
            '_' + rawMsg.replace(/[_*[\]()~>#+=|{}.!-]/g, '\\\\$&') + '_\\n\\n' +
            '📂 *পরিবর্তিত ফাইলসমূহ:*\\n\`\`\`\\n' +
            changedFiles + '\\n\`\`\`\\n\\n' +
            '🌐 *লাইভ সাইট:* https://bjs.kodl.uk\\n' +
            '⏰ *সময়:* ' + bstTime + '\\n' +
            '⚡ *Vercel Deployment:* Auto-syncing production...';

          const payload = JSON.stringify({
            chat_id: chatId,
            text,
            parse_mode: 'Markdown',
            disable_web_page_preview: true
          });

          const req = https.request({
            hostname: 'api.telegram.org',
            path: '/bot' + token + '/sendMessage',
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload)
            }
          }, (res) => {
            console.log('✓ Telegram alert dispatched. HTTP status:', res.statusCode);
          });

          req.on('error', (err) => {
            console.warn('⚠️ Telegram dispatch warning:', err.message);
          });

          req.write(payload);
          req.end();
          "
